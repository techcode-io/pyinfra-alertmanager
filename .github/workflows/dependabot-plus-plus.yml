name: Dependabot++

on:
  schedule:
    # Run every Sunday at 22:00 UTC (same as Dependabot)
    - cron: '0 22 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  project-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup github actions bot
        uses: ./.github/workflows/setup-github-bot

      - name: Install environment
        uses: ./.github/workflows/env-install

      - name: Read current alertmanager version
        id: before
        run: echo "version=$(uv run python -c 'from pyinfra_alertmanager.tasks import DEFAULT_VERSION; print(DEFAULT_VERSION)')" >> $GITHUB_OUTPUT

      - name: Upgrade alertmanager version
        run: uv run poe project:upgrade

      - name: Check for changes
        id: changes
        run: |
          TASKS_FILE=src/pyinfra_alertmanager/tasks.py
          if git diff --quiet "$TASKS_FILE"; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No changes to $TASKS_FILE"
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            NEW_VERSION=$(uv run python -c 'from pyinfra_alertmanager.tasks import DEFAULT_VERSION; print(DEFAULT_VERSION)')
            echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "alertmanager version updated: ${{ steps.before.outputs.version }} → ${NEW_VERSION}"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            build(deps): bump alertmanager to ${{ steps.changes.outputs.new_version }}

            Updates alertmanager from ${{ steps.before.outputs.version }} to ${{ steps.changes.outputs.new_version }}
          branch: automation-upgrade-${{ steps.changes.outputs.new_version }}
          delete-branch: true
          signoff: true
          title: 'build(deps): bump alertmanager to ${{ steps.changes.outputs.new_version }}'
          body: |
            ## Summary
            Automated update of the default alertmanager version from `${{ steps.before.outputs.version }}` to `${{ steps.changes.outputs.new_version }}`.

            This PR updates `DEFAULT_VERSION` in `src/pyinfra_alertmanager/tasks.py` to track the latest upstream alertmanager release.

            ## Changes
            - `src/pyinfra_alertmanager/tasks.py`: `DEFAULT_VERSION` `${{ steps.before.outputs.version }}` → `${{ steps.changes.outputs.new_version }}`

            ## Release Notes
            See [alertmanager v${{ steps.changes.outputs.new_version }} release notes](https://github.com/prometheus/alertmanager/releases/tag/v${{ steps.changes.outputs.new_version }})

            ---
            🤖 This PR was created automatically by the [Dependabot++ workflow](https://github.com/${{ github.repository }}/actions/workflows/dependabot-plus-plus.yml)
          labels: |
            dependencies
          assignees: ${{ github.repository_owner }}
